name: "1. Generate Brief — 7:00 AM IST"

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST
  workflow_dispatch:
    inputs:
      force:
        description: "Force regenerate today's issue (true/false)"
        required: false
        default: "false"

concurrency:
  group: peopleos-brief-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate & Publish Brief
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY_1:               ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2:               ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3:               ${{ secrets.GROQ_API_KEY_3 }}
      TAVILY_API_KEY:               ${{ secrets.TAVILY_API_KEY }}
      RESEND_API_KEY:               ${{ secrets.RESEND_API_KEY }}
      SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWSLETTER_FROM_EMAIL:        ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_REPLY_TO:          ${{ secrets.NEWSLETTER_REPLY_TO }}
      BASE_URL:                     ${{ secrets.BASE_URL }}
      ADMIN_TEST_EMAIL:             ${{ secrets.ADMIN_TEST_EMAIL }}
      NEWSLETTER_NAME:              "PeopleOS Brief"
      ARCHIVE_RETENTION_DAYS:       "180"
      SECTION_SEARCH_DELAY_SECONDS: "3"
      GROQ_SECTION_DELAY_SECONDS:   "15"
      GROQ_RETRY_DELAY_SECONDS:     "20"
      GROQ_KEY_COOLDOWN_SECONDS:    "20"
      MAX_CANDIDATES_PER_SECTION:   "8"
      MAX_SNIPPET_CHARS:            "300"
      MAX_GROQ_RETRIES_PER_SECTION: "3"
      GENERATION_ATTEMPT:           "scheduled_0700"
      GITHUB_RUN_ID:                ${{ github.run_id }}

    steps:
      - name: "Log: workflow header"
        run: |
          echo "======================================"
          echo "PeopleOS Brief Automation"
          echo "Workflow name : generate-brief-0700"
          echo "Run ID        : ${{ github.run_id }}"
          echo "UTC time      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST time      : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "Computed date : $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          echo "Trigger       : ${{ github.event_name }}"
          echo "Force         : ${{ inputs.force || 'false' }}"
          echo "======================================"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required environment
        run: |
          python -c "
          import os, sys
          required = ['GROQ_API_KEY_1', 'TAVILY_API_KEY']
          missing = [v for v in required if not os.getenv(v)]
          if missing:
              print(f'FATAL: Missing secrets: {missing}', file=sys.stderr)
              sys.exit(1)
          keys = sum(1 for i in (1,2,3) if os.getenv(f'GROQ_API_KEY_{i}'))
          print(f'Environment OK — {keys} Groq key(s) active')
          "

      - name: "Log: status before generation"
        run: |
          echo "--- status.json before ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"
          echo "--- dates.json latest date ---"
          python -c "import json; d=json.load(open('landing/data/dates.json')); print(d['dates'][0] if d.get('dates') else 'empty')" 2>/dev/null || echo "(not found)"

      - name: Mark generation started
        run: python newsletter/main.py --mark-generation-started

      - name: "Generate today's issue (scheduled — idempotent)"
        if: github.event_name == 'schedule' || inputs.force != 'true'
        run: python newsletter/main.py --ensure-today

      - name: "Generate today's issue (force)"
        if: github.event_name == 'workflow_dispatch' && inputs.force == 'true'
        run: |
          python newsletter/main.py --generate-today --force
          python newsletter/main.py --check-today

      - name: Audit source links
        run: python newsletter/main.py --audit-links || echo "Link audit warnings — continuing"

      - name: "Log: status after generation"
        run: |
          echo "--- status.json after ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"
          echo "--- Issue validation ---"
          python newsletter/main.py --check-today || true

      - name: Commit generated files
        run: |
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          git config user.name "peopleos-brief-bot"
          git config user.email "actions@github.com"
          git add landing/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "PeopleOS Brief — $TODAY [skip ci]"
            echo "Committed."
          fi

      - name: Push to main
        run: |
          git push || echo "Nothing to push"
          echo "Push result: $?"

      - name: "Log: git status"
        run: |
          echo "--- git log --oneline -3 ---"
          git log --oneline -3
          echo "--- git status ---"
          git status

      - name: Prune old archives (scheduled only)
        if: github.event_name == 'schedule'
        run: python newsletter/main.py --prune-archive || echo "Prune optional — continuing"
