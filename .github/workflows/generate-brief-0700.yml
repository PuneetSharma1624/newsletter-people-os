name: "1. Generate Brief — 7:00 AM IST"

on:
  schedule:
    - cron: "33 1 * * *"   # 01:33 UTC = 07:03 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke_check | ensure_today | generate_today_force | refresh_index | send_test_email | backfill_initial"
        required: false
        default: "ensure_today"
      force:
        description: "Force regenerate today's issue (true/false)"
        required: false
        default: "false"
      test_email:
        description: "Test email address for send_test_email mode"
        required: false
        default: ""

concurrency:
  group: peopleos-daily-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate & Publish Brief
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY_1:               ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2:               ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3:               ${{ secrets.GROQ_API_KEY_3 }}
      TAVILY_API_KEY:               ${{ secrets.TAVILY_API_KEY }}
      RESEND_API_KEY:               ${{ secrets.RESEND_API_KEY }}
      SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWSLETTER_FROM_EMAIL:        ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_REPLY_TO:          ${{ secrets.NEWSLETTER_REPLY_TO }}
      BASE_URL:                     ${{ secrets.BASE_URL }}
      ADMIN_TEST_EMAIL:             ${{ secrets.ADMIN_TEST_EMAIL }}
      NEWSLETTER_NAME:              "PeopleOS Brief"
      ARCHIVE_RETENTION_DAYS:       "180"
      SECTION_SEARCH_DELAY_SECONDS: "3"
      GROQ_SECTION_DELAY_SECONDS:   "15"
      GROQ_RETRY_DELAY_SECONDS:     "20"
      GROQ_KEY_COOLDOWN_SECONDS:    "20"
      MAX_CANDIDATES_PER_SECTION:   "8"
      MAX_SNIPPET_CHARS:            "300"
      MAX_GROQ_RETRIES_PER_SECTION: "3"
      GENERATION_ATTEMPT:           "scheduled_0700"
      GITHUB_RUN_ID:                ${{ github.run_id }}

    steps:
      - name: "Log: workflow header"
        run: |
          echo "======================================"
          echo "PeopleOS Brief Automation"
          echo "Workflow name : generate-brief-0700"
          echo "Run ID        : ${{ github.run_id }}"
          echo "UTC time      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST time      : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "Computed date : $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          echo "Trigger       : ${{ github.event_name }}"
          echo "Force         : ${{ inputs.force || 'false' }}"
          echo "======================================"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke_check'
        run: |
          python - <<'PY'
          import json, os, pathlib
          print("Smoke check: repo checkout OK")
          for path in ("newsletter/main.py", "landing/data/status.json", "landing/data/dates.json", "landing/data/archive.json"):
              print(f"{path}: {'present' if pathlib.Path(path).exists() else 'missing'}")
          for key in ("GROQ_API_KEY_1", "TAVILY_API_KEY", "BASE_URL"):
              print(f"{key}: {'present' if os.getenv(key) else 'missing'}")
          json.loads(pathlib.Path("landing/data/status.json").read_text())
          import newsletter.main  # noqa: F401
          print("Smoke check complete")
          PY

      - name: Validate required environment
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          python -c "
          import os, sys
          required = ['GROQ_API_KEY_1', 'TAVILY_API_KEY']
          missing = [v for v in required if not os.getenv(v)]
          if missing:
              print(f'FATAL: Missing secrets: {missing}', file=sys.stderr)
              sys.exit(1)
          keys = sum(1 for i in (1,2,3) if os.getenv(f'GROQ_API_KEY_{i}'))
          print(f'Environment OK — {keys} Groq key(s) active')
          "

      - name: "Log: status before generation"
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          echo "--- status.json before ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"
          echo "--- dates.json latest date ---"
          python -c "import json; d=json.load(open('landing/data/dates.json')); print(d['dates'][0] if d.get('dates') else 'empty')" 2>/dev/null || echo "(not found)"

      - name: Check today's issue before generation
        id: check_today
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ensure_today')
        shell: bash
        run: |
          set +e
          python newsletter/main.py --check-today
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "Today's issue is already complete. Skipping generation."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Today's issue is missing or incomplete. Force generation required."
          fi

      - name: Generate today's issue if incomplete
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ensure_today')) && steps.check_today.outputs.complete != 'true'
        run: python newsletter/main.py --generate-today --force

      - name: Validate today's issue after generation
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ensure_today')) && steps.check_today.outputs.complete != 'true'
        run: python newsletter/main.py --check-today

      - name: "Generate today's issue (force — manual dispatch)"
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'generate_today_force' || inputs.force == 'true')
        run: |
          python newsletter/main.py --generate-today --force
          python newsletter/main.py --check-today

      - name: Refresh archive index
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh_index'
        run: python newsletter/main.py --refresh-index

      - name: Backfill initial archive
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill_initial'
        run: python newsletter/main.py --backfill-initial

      - name: Send test email
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'send_test_email' && inputs.test_email != ''
        run: python newsletter/main.py --test "${{ inputs.test_email }}"

      - name: Audit source links
        if: github.event_name == 'schedule' || inputs.mode == 'ensure_today' || inputs.mode == 'generate_today_force' || inputs.force == 'true'
        run: python newsletter/main.py --audit-links || echo "Link audit warnings — continuing"

      - name: "Log: status after generation"
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          echo "--- status.json after ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"
          echo "--- Issue validation ---"
          python newsletter/main.py --check-today || true

      - name: Commit generated files
        if: github.event_name == 'schedule' || inputs.mode == 'ensure_today' || inputs.mode == 'generate_today_force' || inputs.mode == 'refresh_index' || inputs.mode == 'backfill_initial' || inputs.force == 'true'
        run: |
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          git config user.name "peopleos-brief-bot"
          git config user.email "actions@github.com"
          git add landing/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "PeopleOS Brief — $TODAY [skip ci]"
            echo "Committed."
          fi

      - name: Push to main
        if: github.event_name == 'schedule' || inputs.mode == 'ensure_today' || inputs.mode == 'generate_today_force' || inputs.mode == 'refresh_index' || inputs.mode == 'backfill_initial' || inputs.force == 'true'
        run: |
          git push || echo "Nothing to push"
          echo "Push result: $?"

      - name: "Log: git status"
        run: |
          echo "--- git log --oneline -3 ---"
          git log --oneline -3
          echo "--- git status ---"
          git status

      - name: Mark generation failed if workflow failed
        if: failure()
        run: python newsletter/main.py --mark-generation-failed || true

      - name: Prune old archives (scheduled only)
        if: github.event_name == 'schedule'
        run: python newsletter/main.py --prune-archive || echo "Prune optional — continuing"

      - name: Write automation-health.json (generate)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          ISSUE_FILE="landing/data/issues/${TODAY}.json"
          FILE_EXISTS="false"
          [ -f "$ISSUE_FILE" ] && FILE_EXISTS="true"
          OVERALL="${{ job.status }}"
          python - <<PYEOF
          import json, pathlib, os
          health_file = pathlib.Path("landing/data/automation-health.json")
          try:
              existing = json.loads(health_file.read_text()) if health_file.exists() else {}
          except Exception:
              existing = {}
          existing["last_generate"] = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", "unknown"),
              "run_id": "${{ github.run_id }}",
              "issue_date": "$TODAY",
              "issue_file_exists": $FILE_EXISTS == "true",
              "status": "${OVERALL}".lower(),
              "ist_time": "$IST",
              "utc_time": "$UTC",
          }
          health_file.parent.mkdir(parents=True, exist_ok=True)
          health_file.write_text(json.dumps(existing, indent=2))
          print(f"automation-health.json updated (generate)")
          PYEOF
          git config user.name "peopleos-brief-bot" 2>/dev/null || true
          git config user.email "actions@github.com" 2>/dev/null || true
          git add landing/data/automation-health.json
          git diff --staged --quiet || git commit -m "chore: update automation-health.json [skip ci]" || true
          git push || true

      - name: Job summary (generate)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          ISSUE_FILE="landing/data/issues/${TODAY}.json"
          FILE_EXISTS="no"
          [ -f "$ISSUE_FILE" ] && FILE_EXISTS="yes"
          CHECK_RESULT="failed"
          python newsletter/main.py --check-today 2>/dev/null && CHECK_RESULT="passed" || true
          STATUS="${{ job.status }}"
          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY
          ## Generate Brief — $TODAY
          | Field | Value |
          |---|---|
          | Workflow | generate-brief |
          | Event | ${{ github.event_name }} |
          | Run ID | ${{ github.run_id }} |
          | Branch | ${{ github.ref }} |
          | UTC time | $UTC |
          | IST time | $IST |
          | Issue date | $TODAY |
          | Issue file exists | $FILE_EXISTS |
          | check-today result | $CHECK_RESULT |
          | Final result | $STATUS |
          SUMMARY
