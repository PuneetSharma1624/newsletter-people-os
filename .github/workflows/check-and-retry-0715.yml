name: "2. Check & Retry Brief — 7:15 AM IST"

on:
  schedule:
    - cron: "20 2 * * *"   # 02:20 UTC = 07:50 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke_check | check_retry"
        required: false
        default: "check_retry"

concurrency:
  group: peopleos-daily-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-retry:
    name: Check Brief — Retry if Incomplete
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY_1:               ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2:               ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3:               ${{ secrets.GROQ_API_KEY_3 }}
      TAVILY_API_KEY:               ${{ secrets.TAVILY_API_KEY }}
      RESEND_API_KEY:               ${{ secrets.RESEND_API_KEY }}
      SUPABASE_URL:                 ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:            ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY:    ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWSLETTER_FROM_EMAIL:        ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_REPLY_TO:          ${{ secrets.NEWSLETTER_REPLY_TO }}
      BASE_URL:                     ${{ secrets.BASE_URL }}
      NEWSLETTER_NAME:              "PeopleOS Brief"
      ARCHIVE_RETENTION_DAYS:       "180"
      SECTION_SEARCH_DELAY_SECONDS: "3"
      GROQ_SECTION_DELAY_SECONDS:   "15"
      GROQ_RETRY_DELAY_SECONDS:     "20"
      GROQ_KEY_COOLDOWN_SECONDS:    "20"
      MAX_CANDIDATES_PER_SECTION:   "8"
      MAX_SNIPPET_CHARS:            "300"
      MAX_GROQ_RETRIES_PER_SECTION: "3"
      GENERATION_ATTEMPT:           "retry_0715"
      GITHUB_RUN_ID:                ${{ github.run_id }}

    steps:
      - name: "Log: workflow header"
        run: |
          echo "======================================"
          echo "PeopleOS Brief Automation"
          echo "Workflow name : check-and-retry-0715"
          echo "Run ID        : ${{ github.run_id }}"
          echo "UTC time      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST time      : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "Computed date : $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          echo "======================================"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke check
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke_check'
        run: |
          python - <<'PY'
          import json, os, pathlib
          print("Check/retry smoke check: repo checkout OK")
          for path in ("newsletter/main.py", "landing/data/status.json"):
              print(f"{path}: {'present' if pathlib.Path(path).exists() else 'missing'}")
          for key in ("GROQ_API_KEY_1", "TAVILY_API_KEY"):
              print(f"{key}: {'present' if os.getenv(key) else 'missing'}")
          json.loads(pathlib.Path("landing/data/status.json").read_text())
          print("Smoke check complete")
          PY

      - name: Validate required environment
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          python -c "
          import os, sys
          required = ['GROQ_API_KEY_1', 'TAVILY_API_KEY']
          missing = [v for v in required if not os.getenv(v)]
          if missing:
              print(f'FATAL: Missing secrets: {missing}', file=sys.stderr)
              sys.exit(1)
          keys = sum(1 for i in (1,2,3) if os.getenv(f'GROQ_API_KEY_{i}'))
          print(f'Environment OK — {keys} Groq key(s) active')
          "

      - name: "Log: status before check"
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          echo "--- status.json ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"

      - name: "Check today's brief completeness"
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        id: check
        run: |
          python newsletter/main.py --check-today && echo "BRIEF_COMPLETE=true" >> $GITHUB_OUTPUT || echo "BRIEF_COMPLETE=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: "Skip if complete"
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check') && steps.check.outputs.BRIEF_COMPLETE == 'true'
        run: |
          echo "Today's brief is complete. No retry needed."

      - name: "Force retry generation if incomplete"
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check') && steps.check.outputs.BRIEF_COMPLETE != 'true'
        run: |
          echo "Today's brief is missing or incomplete. Running forced retry..."
          python newsletter/main.py --generate-today --force

      - name: "Validate after retry"
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check') && steps.check.outputs.BRIEF_COMPLETE != 'true'
        run: python newsletter/main.py --check-today

      - name: Audit source links (on retry only)
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check') && steps.check.outputs.BRIEF_COMPLETE != 'true'
        run: python newsletter/main.py --audit-links || echo "Link audit warnings — continuing"

      - name: "Commit if files changed (retry path)"
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check') && steps.check.outputs.BRIEF_COMPLETE != 'true'
        run: |
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          git config user.name "peopleos-brief-bot"
          git config user.email "actions@github.com"
          git add landing/data/
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "PeopleOS Brief retry — $TODAY [skip ci]"
            git push || echo "Nothing to push"
          fi

      - name: Mark generation failed if workflow failed
        if: failure()
        run: python newsletter/main.py --mark-generation-failed || true

      - name: "Log: final status"
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'smoke_check'
        run: |
          echo "--- status.json after ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"

      - name: Write automation-health.json (retry)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          RETRY_RAN="${{ steps.check.outputs.BRIEF_COMPLETE != 'true' }}"
          OVERALL="${{ job.status }}"
          python - <<PYEOF
          import json, pathlib, os
          health_file = pathlib.Path("landing/data/automation-health.json")
          try:
              existing = json.loads(health_file.read_text()) if health_file.exists() else {}
          except Exception:
              existing = {}
          brief_complete = "${{ steps.check.outputs.BRIEF_COMPLETE }}" == "true"
          existing["last_retry"] = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", "unknown"),
              "run_id": "${{ github.run_id }}",
              "status": "${OVERALL}".lower(),
              "retry_needed": not brief_complete,
              "ist_time": "$IST",
              "utc_time": "$UTC",
          }
          health_file.parent.mkdir(parents=True, exist_ok=True)
          health_file.write_text(json.dumps(existing, indent=2))
          print("automation-health.json updated (retry)")
          PYEOF
          git config user.name "peopleos-brief-bot" 2>/dev/null || true
          git config user.email "actions@github.com" 2>/dev/null || true
          git add landing/data/automation-health.json
          git diff --staged --quiet || git commit -m "chore: update automation-health.json [skip ci]" || true
          git push || true

      - name: Job summary (retry)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          BRIEF_COMPLETE="${{ steps.check.outputs.BRIEF_COMPLETE }}"
          RETRY_RAN="no"
          [ "$BRIEF_COMPLETE" != "true" ] && RETRY_RAN="yes"
          STATUS="${{ job.status }}"
          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY
          ## Check & Retry Brief
          | Field | Value |
          |---|---|
          | Workflow | check-and-retry |
          | Event | ${{ github.event_name }} |
          | Run ID | ${{ github.run_id }} |
          | UTC time | $UTC |
          | IST time | $IST |
          | check-today result | $([ "$BRIEF_COMPLETE" = "true" ] && echo "passed" || echo "failed") |
          | Retry needed | $RETRY_RAN |
          | Force generate run | $RETRY_RAN |
          | Final result | $STATUS |
          SUMMARY
