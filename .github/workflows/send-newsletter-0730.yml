name: "3. Send Newsletter — 7:30 AM IST"

on:
  schedule:
    - cron: "45 2 * * *"   # 02:45 UTC = 08:15 IST
  workflow_dispatch:
    inputs:
      send_live:
        description: "Actually send the newsletter to subscribers"
        required: true
        default: false
        type: boolean
      force_resend:
        description: "Allow resend even if status says already sent today"
        required: false
        default: false
        type: boolean

concurrency:
  group: peopleos-daily-send
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    name: Send Newsletter (today's issue only)
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY_1:            ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2:            ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3:            ${{ secrets.GROQ_API_KEY_3 }}
      TAVILY_API_KEY:            ${{ secrets.TAVILY_API_KEY }}
      RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEWSLETTER_FROM_EMAIL:     ${{ secrets.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_REPLY_TO:       ${{ secrets.NEWSLETTER_REPLY_TO }}
      BASE_URL:                  ${{ secrets.BASE_URL }}
      NEWSLETTER_NAME:           "PeopleOS Brief"

    steps:
      - name: "Log: workflow header"
        run: |
          echo "======================================"
          echo "PeopleOS Brief Automation"
          echo "Workflow name : send-newsletter-0730"
          echo "Run ID        : ${{ github.run_id }}"
          echo "UTC time      : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST time      : $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "Computed date : $(TZ='Asia/Kolkata' date '+%Y-%m-%d')"
          echo "Trigger       : ${{ github.event_name }}"
          echo "send_live     : ${{ inputs.send_live || 'scheduled (auto)' }}"
          echo "======================================"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required environment
        run: |
          python -c "
          import os, sys
          required = [
            'GROQ_API_KEY_1','TAVILY_API_KEY','RESEND_API_KEY',
            'SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY',
            'NEWSLETTER_FROM_EMAIL','BASE_URL'
          ]
          missing = [v for v in required if not os.getenv(v)]
          if missing:
            print(f'FATAL: Missing secrets: {missing}', file=sys.stderr)
            sys.exit(1)
          keys = sum(1 for i in (1,2,3) if os.getenv(f'GROQ_API_KEY_{i}'))
          print(f'Environment OK — {keys} Groq key(s) active')
          "

      - name: Explain send mode
        run: |
          echo "======================================"
          echo "event_name   : ${{ github.event_name }}"
          echo "send_live    : ${{ inputs.send_live }}"
          echo "force_resend : ${{ inputs.force_resend }}"
          echo "Scheduled runs send live automatically."
          echo "Manual runs send live only when send_live=true."
          echo "======================================"

      - name: "Log: status before send"
        run: |
          echo "--- status.json ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"

      - name: Wait for local issue to be ready
        shell: bash
        run: |
          for i in {1..15}; do
            echo "Checking local issue readiness — attempt $i/15..."
            git pull origin main --quiet
            if python newsletter/main.py --check-today; then
              echo "Local issue is ready."
              exit 0
            fi
            echo "Not ready yet. Waiting 60 seconds..."
            sleep 60
          done
          echo "Local issue still missing or incomplete after 15 minutes."
          exit 1

      - name: Wait for Vercel production issue readiness
        if: github.event_name == 'schedule' || inputs.send_live == true || inputs.send_live == 'true'
        run: python newsletter/main.py --wait-production-today

      - name: "Send live newsletter"
        id: send
        if: github.event_name == 'schedule' || inputs.send_live == true || inputs.send_live == 'true'
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.force_resend }}" = "true" ]; then
            python newsletter/main.py --send-live-today --force-resend 2>&1 | tee /tmp/send_output.txt
          else
            python newsletter/main.py --send-live-today 2>&1 | tee /tmp/send_output.txt
          fi
          SEND_EXIT=${PIPESTATUS[0]}

          # Parse machine-readable lines from output
          SEND_RESULT=$(grep '^SEND_RESULT=' /tmp/send_output.txt | tail -1 | cut -d= -f2 || echo "unknown")
          STATS_LINE=$(grep '^STATS: subscribers=' /tmp/send_output.txt | tail -1 || echo "")
          ATTEMPTED=$(echo "$STATS_LINE" | grep -oP 'subscribers=\K[0-9]+' || echo "0")
          ACCEPTED=$(echo "$STATS_LINE" | grep -oP 'accepted=\K[0-9]+' || echo "0")
          DB_LOGGED=$(echo "$STATS_LINE" | grep -oP 'db_logged=\K[0-9]+' || echo "0")
          SKIPPED=$(echo "$STATS_LINE" | grep -oP 'skipped=\K[0-9]+' || echo "0")
          FAILED=$(echo "$STATS_LINE" | grep -oP 'failed=\K[0-9]+' || echo "0")

          echo "send_result=${SEND_RESULT}" >> "$GITHUB_OUTPUT"
          echo "attempted=${ATTEMPTED}" >> "$GITHUB_OUTPUT"
          echo "accepted=${ACCEPTED}" >> "$GITHUB_OUTPUT"
          echo "db_logged=${DB_LOGGED}" >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "SEND_RESULT : $SEND_RESULT"
          echo "attempted   : $ATTEMPTED"
          echo "accepted    : $ACCEPTED"
          echo "db_logged   : $DB_LOGGED"
          echo "skipped     : $SKIPPED"
          echo "failed      : $FAILED"
          echo "======================================"

          exit $SEND_EXIT

      - name: "Dry check only (manual — send_live not true)"
        if: github.event_name == 'workflow_dispatch' && inputs.send_live != true && inputs.send_live != 'true'
        run: |
          echo "Manual dry check only. No email was sent."
          echo "To send live, rerun workflow with send_live=true."
          python newsletter/main.py --check-today

      - name: "Log: final status"
        run: |
          echo "--- status.json after ---"
          cat landing/data/status.json 2>/dev/null || echo "(not found)"

      - name: Write automation-health.json (send)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          OVERALL="${{ job.status }}"
          python - <<PYEOF
          import json, pathlib, os
          health_file = pathlib.Path("landing/data/automation-health.json")
          try:
              existing = json.loads(health_file.read_text()) if health_file.exists() else {}
          except Exception:
              existing = {}
          existing["last_send"] = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", "unknown"),
              "run_id": "${{ github.run_id }}",
              "issue_date": "$TODAY",
              "status": "${OVERALL}".lower(),
              "ist_time": "$IST",
              "utc_time": "$UTC",
              "send_live": "${{ inputs.send_live || 'true (scheduled)' }}",
          }
          health_file.parent.mkdir(parents=True, exist_ok=True)
          health_file.write_text(json.dumps(existing, indent=2))
          print("automation-health.json updated (send)")
          PYEOF
          git config user.name "peopleos-brief-bot" 2>/dev/null || true
          git config user.email "actions@github.com" 2>/dev/null || true
          git add landing/data/automation-health.json
          git diff --staged --quiet || git commit -m "chore: update automation-health.json [skip ci]" || true
          git push || true

      - name: Job summary (send)
        if: always()
        run: |
          IST=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          UTC=$(date -u '+%Y-%m-%d %H:%M:%SZ')
          TODAY=$(TZ='Asia/Kolkata' date '+%Y-%m-%d')
          BASE="${BASE_URL:-not_set}"
          PROD_URL="${BASE}/data/issues/${TODAY}.json"
          JOB_STATUS="${{ job.status }}"
          SEND_RESULT="${{ steps.send.outputs.send_result }}"
          ATTEMPTED="${{ steps.send.outputs.attempted }}"
          ACCEPTED="${{ steps.send.outputs.accepted }}"
          DB_LOGGED="${{ steps.send.outputs.db_logged }}"
          SKIPPED="${{ steps.send.outputs.skipped }}"
          FAILED="${{ steps.send.outputs.failed }}"
          # Fall back to job status label if send step did not run (dry-check only)
          [ -z "$SEND_RESULT" ] && SEND_RESULT="dry_check_only"
          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY
          ## Send Newsletter — $TODAY
          | Field | Value |
          |---|---|
          | Workflow | send-newsletter |
          | Event | ${{ github.event_name }} |
          | Run ID | ${{ github.run_id }} |
          | UTC time | $UTC |
          | IST time | $IST |
          | Issue date | $TODAY |
          | Production JSON URL | $PROD_URL |
          | send_live | ${{ inputs.send_live || 'true (scheduled)' }} |
          | force_resend | ${{ inputs.force_resend || 'false' }} |
          | attempted | ${ATTEMPTED:-—} |
          | accepted_by_resend | ${ACCEPTED:-—} |
          | db_logged | ${DB_LOGGED:-—} |
          | skipped | ${SKIPPED:-—} |
          | failed | ${FAILED:-—} |
          | send_result | **${SEND_RESULT}** |
          | job status | $JOB_STATUS |
          SUMMARY
