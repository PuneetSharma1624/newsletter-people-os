<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — PeopleOS Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
    .login-card{
      width:100%;max-width:400px;
      background:var(--bg-elevated);
      border:1px solid var(--border-default);
      border-radius:var(--radius-xl);
      padding:36px 32px;
      box-shadow:0 24px 64px rgba(0,0,0,0.6);
    }
    .login-dot{
      width:36px;height:36px;border-radius:10px;
      background:var(--accent-glow);border:1px solid var(--accent-border);
      display:flex;align-items:center;justify-content:center;
      margin-bottom:20px;
    }
    .login-dot::before{
      content:'';display:block;width:10px;height:10px;border-radius:50%;
      background:var(--accent);box-shadow:0 0 10px rgba(99,102,241,0.8);
    }
    .login-eyebrow{
      font-size:0.68rem;font-weight:700;color:var(--accent);
      text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;
    }
    .login-title{
      font-size:1.4rem;font-weight:800;color:var(--white);
      letter-spacing:-0.03em;margin-bottom:6px;
    }
    .login-sub{font-size:0.82rem;color:var(--text-muted);margin-bottom:28px;line-height:1.5;}
    .field{margin-bottom:16px;}
    .field label{
      display:block;font-size:0.7rem;font-weight:700;color:var(--text-dim);
      margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;
    }
    input[type=password]{
      width:100%;background:var(--bg-card);
      border:1px solid var(--border-default);border-radius:var(--radius);
      color:var(--white);font-family:var(--font);font-size:0.9rem;
      padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s;
    }
    input[type=password]:focus{
      border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,0.12);
    }
    .login-btn{
      width:100%;background:var(--accent);border:none;border-radius:var(--radius);
      color:var(--white);cursor:pointer;font-family:var(--font);
      font-size:0.875rem;font-weight:700;letter-spacing:-0.01em;
      padding:13px;transition:background .15s,transform .1s;margin-top:4px;
    }
    .login-btn:hover{background:var(--accent-hover);transform:translateY(-1px);}
    .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .msg{margin-top:12px;font-size:0.82rem;min-height:20px;text-align:center;line-height:1.4;}
    .msg.error{color:var(--danger);}
    .msg.success{color:var(--success);}
    .login-footer{
      margin-top:24px;padding-top:20px;
      border-top:1px solid var(--border-subtle);
      display:flex;align-items:center;justify-content:space-between;
    }
    .login-footer a{
      font-size:0.75rem;color:var(--text-dim);text-decoration:none;transition:color .15s;
    }
    .login-footer a:hover{color:var(--text-muted);}
    .security-badge{
      font-size:0.68rem;color:var(--text-dim);
      display:flex;align-items:center;gap:4px;
    }
    .security-badge::before{
      content:'🔒';font-size:0.7rem;
    }
    .dev-warn{
      margin-top:16px;padding:12px 14px;
      background:rgba(239,68,68,0.06);
      border:1px solid rgba(239,68,68,0.15);
      border-radius:var(--radius);
      font-size:0.72rem;color:rgba(239,68,68,0.8);line-height:1.55;
    }
    .dev-warn code{
      background:rgba(239,68,68,0.1);padding:1px 5px;border-radius:3px;
      font-family:monospace;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-dot"></div>
    <div class="login-eyebrow">PeopleOS Brief</div>
    <h1 class="login-title">Admin Access</h1>
    <p class="login-sub">Enter your admin token to access the control panel.</p>

    <form id="loginForm">
      <div class="field">
        <label for="tokenInput">Admin Token</label>
        <input type="password" id="tokenInput" placeholder="••••••••••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Authenticate</button>
      <p class="msg" id="msg"></p>
    </form>

    <div class="login-footer">
      <a href="/">← Back to Dashboard</a>
      <span class="security-badge">Authorized access only</span>
    </div>
  </div>

  <script>
    // Local static server warning
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const port = location.port;
      if (port !== '3000' && port !== '') {
        const w = document.createElement('div');
        w.className = 'dev-warn';
        w.innerHTML = '<strong>Local dev:</strong> Admin API unavailable on static server.<br>'
          + 'Use <code>vercel dev</code> (port 3000) to test login. '
          + '<code>python -m http.server</code> only serves static files.';
        document.querySelector('.login-card').appendChild(w);
      }
    }
  </script>
  <script src="/admin.js"></script>
</body>
</html>
