<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" fill="none">
  <defs>
    <radialGradient id="bodyGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scopeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="scopeBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient body glow -->
  <ellipse cx="210" cy="320" rx="120" ry="100" fill="url(#bodyGlow)"/>

  <!-- Crescent moon -->
  <circle cx="320" cy="70" r="28" fill="#1e3a5f"/>
  <circle cx="333" cy="62" r="23" fill="#071225"/>
  <!-- Moon glow -->
  <circle cx="320" cy="70" r="35" fill="none" stroke="#bfdbfe" stroke-width="0.5" opacity="0.3"/>
  <circle cx="320" cy="70" r="42" fill="none" stroke="#bfdbfe" stroke-width="0.3" opacity="0.15"/>

  <!-- Telescope scope glow at eye end -->
  <circle cx="145" cy="248" r="14" fill="url(#scopeGlow)" filter="url(#glow)"/>
  <circle cx="145" cy="248" r="5" fill="#4f46e5" opacity="0.8" filter="url(#glow)"/>

  <!-- Telescope body — angled up-left -->
  <!-- Main barrel -->
  <rect x="130" y="240" width="148" height="16" rx="8"
        transform="rotate(-28 130 240)"
        fill="url(#scopeBarGrad)" opacity="0.9"/>
  <!-- Barrel highlight -->
  <rect x="132" y="241" width="144" height="5" rx="4"
        transform="rotate(-28 132 241)"
        fill="#ffffff" opacity="0.12"/>
  <!-- Eyepiece end -->
  <rect x="126" y="242" width="22" height="20" rx="6"
        transform="rotate(-28 126 242)"
        fill="#1e3a5f" stroke="#4f46e5" stroke-width="1"/>
  <!-- Lens end -->
  <circle cx="272" cy="185" r="11" fill="#0b1f3a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="272" cy="185" r="5" fill="#38bdf8" opacity="0.4"/>

  <!-- Tripod legs -->
  <line x1="200" y1="330" x2="155" y2="420" stroke="#0f2744" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="200" y2="425" stroke="#0f2744" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="330" x2="248" y2="420" stroke="#0f2744" stroke-width="3" stroke-linecap="round"/>
  <!-- Tripod crossbar -->
  <line x1="166" y1="380" x2="238" y2="380" stroke="#0f2744" stroke-width="2" stroke-linecap="round"/>
  <!-- Tripod head -->
  <circle cx="200" cy="330" r="7" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>

  <!-- Figure body — silhouette -->
  <!-- Torso -->
  <path d="M190,285 Q185,265 192,250 Q198,240 210,240 Q222,240 228,250 Q235,265 228,285 Z"
        fill="url(#figureGrad)" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- Shoulder highlight -->
  <path d="M192,255 Q198,248 210,248 Q222,248 226,255"
        stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" fill="none"/>

  <!-- Right arm extended to scope -->
  <path d="M192,262 Q175,258 162,252 Q150,247 145,248"
        stroke="#1e3a5f" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M192,262 Q175,258 162,252 Q150,247 145,248"
        stroke="#1d3a5a" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left arm at side -->
  <path d="M228,265 Q238,272 242,285"
        stroke="#1e3a5f" stroke-width="11" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <ellipse cx="210" cy="228" rx="18" ry="19" fill="url(#figureGrad)"/>
  <!-- Hat brim -->
  <ellipse cx="210" cy="214" rx="24" ry="5" fill="#0f2744"/>
  <!-- Hat crown -->
  <path d="M190,214 Q190,196 210,194 Q230,196 230,214 Z" fill="#0f2744"/>
  <!-- Hat highlight -->
  <path d="M195,207 Q200,198 215,197" stroke="#1e3a5f" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Legs -->
  <path d="M200,285 L195,345 L188,380" stroke="#0d1e38" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M220,285 L224,345 L230,380" stroke="#0d1e38" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Leg highlight -->
  <path d="M200,285 L195,345" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Subtle blue rim light on figure -->
  <path d="M228,250 Q236,260 230,285 Q224,300 220,285"
        stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M192,250 Q185,258 190,285"
        stroke="#38bdf8" stroke-width="0.8" fill="none" opacity="0.2"/>

  <!-- Signal rays from lens -->
  <line x1="272" y1="185" x2="355" y2="110" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.35"/>
  <line x1="272" y1="185" x2="370" y2="145" stroke="#4f46e5" stroke-width="0.6" stroke-dasharray="3,8" opacity="0.25"/>
  <line x1="272" y1="185" x2="345" y2="90" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="2,10" opacity="0.2"/>
</svg>
